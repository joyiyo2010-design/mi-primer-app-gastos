<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDPZI2o8QAFRx0XNmbYipkTxzWFQvUdrrI",
    authDomain: "mis-gastos-familiares.firebaseapp.com",
    projectId: "mis-gastos-familiares",
    storageBucket: "mis-gastos-familiares.firebasestorage.app",
    messagingSenderId: "391296606617",
    appId: "1:391296606617:web:e9d413c9fb36d321dc7308"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const txCollection = collection(db, "transactions");

  // Variables globales de estado
  window.transactions = [];
  let monthlyBudget = parseFloat(localStorage.getItem('myBudget')) || 0;
  let currentFilter = 'monthly';
  let categoryChartInstance = null;
  let barChartInstance = null;

  document.getElementById('date').valueAsDate = new Date();
  if (monthlyBudget > 0) document.getElementById('budgetInput').value = monthlyBudget;

  // 1. Guardar Movimiento en Firestore
  document.getElementById('transactionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const type = document.getElementById('type').value;
    const desc = document.getElementById('desc').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const date = document.getElementById('date').value;

    if (!desc || isNaN(amount)) return;

    try {
      await addDoc(txCollection, {
        type,
        desc,
        amount,
        category,
        date
      });
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    } catch (error) {
      console.error("Error al guardar en Firestore:", error);
    }
  });

  // 2. Escuchar cambios en tiempo real desde Firestore
  onSnapshot(txCollection, (snapshot) => {
    window.transactions = snapshot.docs.map(docSnapshot => ({
      id: docSnapshot.id,
      ...docSnapshot.data()
    }));
    render();
  });

  // 3. Eliminar Movimiento de Firestore
  window.deleteTransaction = async function(docId) {
    try {
      await deleteDoc(doc(db, "transactions", docId));
    } catch (error) {
      console.error("Error al eliminar de Firestore:", error);
    }
  };

  // Funciones de presupuesto y filtros
  window.saveBudget = function() {
    const val = parseFloat(document.getElementById('budgetInput').value);
    monthlyBudget = isNaN(val) ? 0 : val;
    localStorage.setItem('myBudget', monthlyBudget);
    render();
  };

  window.setFilter = function(type) {
    currentFilter = type;
    render();
  };

  function getFilteredTransactions() {
    const now = new Date();
    return window.transactions.filter(item => {
      const itemDate = new Date(item.date + 'T00:00:00');
      if (currentFilter === 'daily') {
        return itemDate.toDateString() === now.toDateString();
      } else if (currentFilter === 'weekly') {
        const oneWeekAgo = new Date(now);
        oneWeekAgo.setDate(now.getDate() - 7);
        return itemDate >= oneWeekAgo && itemDate <= now;
      } else if (currentFilter === 'monthly') {
        return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
      }
      return true;
    });
  }

  // 4. Renderizado Principal
  function render() {
    const filtered = getFilteredTransactions();
    const listEl = document.getElementById('transactionList');
    
    let totalIncome = 0;
    let totalExpense = 0;
    const categoryTotals = {};
    listEl.innerHTML = '';

    filtered.forEach(item => {
      if (item.type === 'income') {
        totalIncome += item.amount;
      } else {
        totalExpense += item.amount;
        categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.amount;
      }
      const li = document.createElement('li');
      li.className = 'py-3 flex justify-between items-center text-sm';
      const isIncome = item.type === 'income';
      li.innerHTML = `
        <div>
          <p class="font-medium text-gray-800 dark:text-gray-200">${item.desc}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">${item.category} • ${item.date}</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
            ${isIncome ? '+' : '-'}$${item.amount.toFixed(2)}
          </span>
          <button onclick="deleteTransaction('${item.id}')" class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
      `;
      listEl.appendChild(li);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<p class="text-center text-gray-400 py-4 text-sm">Sin registros en este periodo.</p>';
    }

    document.getElementById('incomeDisplay').textContent = `$${totalIncome.toFixed(2)}`;
    document.getElementById('expenseDisplay').textContent = `$${totalExpense.toFixed(2)}`;
    const balance = totalIncome - totalExpense;
    document.getElementById('balanceDisplay').textContent = `$${balance.toFixed(2)}`;

    updateBudgetProgress(totalExpense);
    renderCategoryChart(categoryTotals);
    renderBarChart(totalIncome, totalExpense);
  }

  function updateBudgetProgress(currentExpenses) {
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('budgetStatus');
    if (monthlyBudget <= 0) {
      progressBar.style.width = '0%';
      statusText.textContent = 'Sin presupuesto establecido';
      return;
    }
    const percentage = Math.min((currentExpenses / monthlyBudget) * 100, 100);
    progressBar.style.width = `${percentage}%`;
    if (currentExpenses > monthlyBudget) {
      progressBar.className = 'bg-rose-600 h-full transition-all duration-500';
      statusText.textContent = `⚠️ Presupuesto excedido ($${currentExpenses.toFixed(2)} / $${monthlyBudget.toFixed(2)})`;
      statusText.className = 'text-xs text-rose-600 font-bold mt-2 text-center';
    } else {
      progressBar.className = 'bg-emerald-500 h-full transition-all duration-500';
      statusText.textContent = `Utilizado: $${currentExpenses.toFixed(2)} de $${monthlyBudget.toFixed(2)} (${percentage.toFixed(0)}%)`;
      statusText.className = 'text-xs text-gray-500 dark:text-gray-400 mt-2 text-center';
    }
  }

  window.toggleTheme = function() {
    const html = document.documentElement;
    const icon = document.getElementById('themeIcon');
    const text = document.getElementById('themeText');
    if (html.classList.contains('dark')) {
      html.classList.remove('dark');
      icon.textContent = '🌙';
      text.textContent = 'Modo Oscuro';
    } else {
      html.classList.add('dark');
      icon.textContent = '☀️';
      text.textContent = 'Modo Claro';
    }
  };

  window.exportToCSV = function() {
    if (window.transactions.length === 0) {
      alert('No hay datos para exportar');
      return;
    }
    let csvContent = "data:text/csv;charset=utf-8,Tipo,Descripcion,Monto,Categoria,Fecha\n";
    window.transactions.forEach(t => {
      csvContent += `${t.type},${t.desc},${t.amount},${t.category},${t.date}\n`;
    });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `finanzas_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  function renderCategoryChart(categoryTotals) {
    const ctx = document.getElementById('categoryChart').getContext('2d');
    if (categoryChartInstance) categoryChartInstance.destroy();
    categoryChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(categoryTotals),
        datasets: [{
          data: Object.values(categoryTotals),
          backgroundColor: ['#F59E0B', '#EF4444', '#8B5CF6', '#10B981', '#3B82F6', '#6366F1', '#EC4899', '#14B8A6']
        }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });
  }

  function renderBarChart(income, expense) {
    const ctx = document.getElementById('barChart').getContext('2d');
    if (barChartInstance) barChartInstance.destroy();
    barChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Ingresos', 'Gastos'],
        datasets: [{
          label: 'Monto Total ($)',
          data: [income, expense],
          backgroundColor: ['#10B981', '#EF4444']
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }
</script>
