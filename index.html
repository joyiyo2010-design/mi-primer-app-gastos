<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos Personales</title>
    <!-- Tailwind CSS para diseño fácil y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para los gráficos dinámicos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

    <!-- Encabezado -->
    <header class="bg-indigo-600 text-white py-6 shadow-md mb-8">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">💰 Control de Gastos</h1>
            <p class="text-indigo-200 mt-1">Gestiona tu dinero de forma sencilla y visual</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Formulario y Filtros -->
        <div class="space-y-6">
            
            <!-- Agregar Gasto -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-semibold mb-4 text-indigo-700">➕ Registrar Nuevo Gasto</h2>
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                        <input type="text" id="desc" placeholder="Ej. Almuerzo, Gasolina" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Monto ($)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                        <select id="category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Comida">🍔 Comida</option>
                            <option value="Transporte">🚗 Transporte</option>
                            <option value="Ocio">🎬 Ocio</option>
                            <option value="Salud">🏥 Salud</option>
                            <option value="Ahorro">💰 Ahorro</option>
                            <option value="Servicios">🏠 Servicios / Hogar</option>
                            <option value="Educación">📚 Educación</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                        Guardar Gasto
                    </button>
                </form>
            </div>

            <!-- Filtros de Tiempo -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-indigo-700">🔍 Filtrar Vista</h2>
                    <button id="clearBtn" class="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg transition">
                        🗑️ Limpiar Todo
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setFilter('daily')" class="filter-btn bg-indigo-100 text-indigo-700 py-2 rounded-lg font-medium text-sm hover:bg-indigo-200 transition">Diario</button>
                    <button onclick="setFilter('weekly')" class="filter-btn bg-gray-100 text-gray-700 py-2 rounded-lg font-medium text-sm hover:bg-indigo-200 transition">Semanal</button>
                    <button onclick="setFilter('monthly')" class="filter-btn bg-gray-100 text-gray-700 py-2 rounded-lg font-medium text-sm hover:bg-indigo-200 transition">Mensual</button>
                </div>
            </div>

        </div>

        <!-- Dashboard y Gráfico -->
        <div class="space-y-6">
            
            <!-- Resumen Total -->
            <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 text-center">
                <span class="text-sm text-indigo-600 font-medium uppercase tracking-wider">Total Gastado</span>
                <h3 id="totalDisplay" class="text-4xl font-extrabold text-indigo-900 mt-1">$0.00</h3>
            </div>

            <!-- Gráfico -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-semibold mb-4 text-indigo-700">📊 Distribución por Categoría</h2>
                <div class="relative max-w-xs mx-auto">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- Lista de Gastos -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-semibold mb-4 text-indigo-700">📋 Historial</h2>
                <ul id="expenseList" class="divide-y divide-gray-100 max-h-60 overflow-y-auto">
                    <!-- Los elementos se cargan dinámicamente -->
                </ul>
            </div>

        </div>

    </main>

    <script>
        // Cargar gastos guardados o iniciar array vacío
        let expenses = JSON.parse(localStorage.getItem('myExpenses')) || [];
        let currentFilter = 'daily';
        let chartInstance = null;

        // Establecer fecha de hoy por defecto en el formulario
        document.getElementById('date').valueAsDate = new Date();

        // Guardar nuevo gasto
        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;

            expenses.push({ id: Date.now(), desc, amount, category, date });
            saveAndRender();

            // Limpiar campos
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        });

        // Guardar en LocalStorage y renderizar
        function saveAndRender() {
            localStorage.setItem('myExpenses', JSON.stringify(expenses));
            render();
        }

        // Cambiar filtro activo
        function setFilter(type) {
            currentFilter = type;
            render();
        }

        // Filtrar gastos según fecha
        function getFilteredExpenses() {
            const now = new Date();
            return expenses.filter(exp => {
                const expDate = new Date(exp.date + 'T00:00:00');
                if (currentFilter === 'daily') {
                    return expDate.toDateString() === now.toDateString();
                } else if (currentFilter === 'weekly') {
                    const oneWeekAgo = new Date(now);
                    oneWeekAgo.setDate(now.getDate() - 7);
                    return expDate >= oneWeekAgo && expDate <= now;
                } else if (currentFilter === 'monthly') {
                    return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear();
                }
                return true;
            });
        }

        // Renderizar Interfaz
        function render() {
            const filtered = getFilteredExpenses();
            const listEl = document.getElementById('expenseList');
            const totalEl = document.getElementById('totalDisplay');

            // Renderizar Lista
            listEl.innerHTML = '';
            let total = 0;
            const categoryTotals = {};

            filtered.forEach(exp => {
                total += exp.amount;
                categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;

                const li = document.createElement('li');
                li.className = 'py-3 flex justify-between items-center text-sm';
                li.innerHTML = `
                    <div>
                        <p class="font-medium text-gray-800">${exp.desc}</p>
                        <p class="text-xs text-gray-500">${exp.category} • ${exp.date}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-700">$${exp.amount.toFixed(2)}</span>
                        <button onclick="deleteExpense(${exp.id})" class="text-red-400 hover:text-red-600 text-xs">✕</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 py-4 text-sm">No hay gastos registrados para este periodo.</p>';
            }

            totalEl.textContent = `$${total.toFixed(2)}`;

            // Renderizar Gráfico
            renderChart(categoryTotals);
        }

        // Eliminar gasto único
        function deleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveAndRender();
        }

        // Limpiar todo
        document.getElementById('clearBtn').addEventListener('click', function() {
            if (confirm('¿Estás seguro de que deseas borrar todos los registros de gastos?')) {
                expenses = [];
                saveAndRender();
            }
        });

        // Gráfico con Chart.js
        function renderChart(categoryTotals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#F59E0B', '#EF4444', '#8B5CF6', '#10B981', '#3B82F6', '#6366F1', '#EC4899'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // Carga inicial
        render();
    </script>
</body>
</html>
